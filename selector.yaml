apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-app-deployment
  labels:
    app: my-app
    type: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
      type: backend
  template:
    metadata: 
      labels:
        app: my-app
        type: backend
    spec:
      containers:
        - name: nginx-container
          image: nginx
